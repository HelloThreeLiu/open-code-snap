<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="1" cy="1" r="1.25">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF5"/>
    </linearGradient>
    <linearGradient id="codebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3340"/>
      <stop offset="1" stop-color="#1F242E"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#10123F" flood-opacity="0.40"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>
  <rect width="256" height="256" rx="56" fill="url(#vig)"/>

  <!-- sparkle on background, top-right -->
  <path d="M200 36 Q201.6 48.4 214 50 Q201.6 51.6 200 64 Q198.4 51.6 186 50 Q198.4 48.4 200 36 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- instant photo card -->
  <g transform="rotate(-6 128 135)" filter="url(#cardShadow)">
    <rect x="50" y="54" width="156" height="162" rx="14" fill="url(#paper)"/>
    <rect x="64" y="68" width="128" height="104" rx="8" fill="url(#codebg)"/>
    <!-- traffic lights -->
    <circle cx="79" cy="83" r="4.5" fill="#FF5F57"/>
    <circle cx="95" cy="83" r="4.5" fill="#FEBC2E"/>
    <circle cx="111" cy="83" r="4.5" fill="#28C840"/>
    <!-- syntax bars -->
    <rect x="78" y="99" width="58" height="7" rx="3.5" fill="#C678DD"/>
    <rect x="88" y="113" width="76" height="7" rx="3.5" fill="#61AFEF"/>
    <rect x="78" y="127" width="94" height="7" rx="3.5" fill="#98C379"/>
    <rect x="88" y="141" width="48" height="7" rx="3.5" fill="#E5C07B"/>
    <!-- mini camera glyph on the paper strip -->
    <path d="M116 190 L119 185 Q120 183.5 122 183.5 H134 Q136 183.5 137 185 L140 190 Z" fill="#64748B"/>
    <rect x="110" y="190" width="36" height="16" rx="4" fill="#64748B"/>
    <circle cx="128" cy="198" r="5" fill="#CBD5E1"/>
    <circle cx="128" cy="198" r="2" fill="#475569"/>
    <circle cx="141" cy="194" r="1.8" fill="#FBBF24"/>
  </g>
</svg>
